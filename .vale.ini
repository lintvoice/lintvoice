# Wording checks: lintvoice checks e-invoices against the official rules, it never certifies them; public terms are
# "valid" and "invalid" examples. Vale skips code spans and blocks, so official identifiers such as
# urn:cen.eu:en16931:2017#compliant#... stay. Run: see the checks job in .github/workflows/ci.yml.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Lintvoice
# Sentences that state the rule itself, or say what we do not do.
TokenIgnores = (never "certified" or "compliant"), (never says it certifies them), (does not certify their compliance), (ne certifie pas leur conformité)
